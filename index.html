<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACK — Digital Wardrobe</title>
<meta name="description" content="Track your wardrobe, what you actually wear, and what it's worth.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%2323201B'/%3E%3Cline x1='15' y1='30' x2='85' y2='30' stroke='%238A6F3B' stroke-width='6'/%3E%3Cpath d='M30 30 L30 75 M50 30 L50 80 M70 30 L70 72' stroke='%23FBF9F4' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260915a">
</head>
<body>

<header class="app-header">
  <div class="app-header__inner">
    <div class="brand">RACK <small>digital wardrobe</small></div>
    <nav class="nav">
      <button class="nav__link" data-tab="dashboard">Dashboard</button>
      <button class="nav__link" data-tab="wardrobe">Wardrobe</button>
      <button class="nav__link" data-tab="outfit">Outfit</button>
      <button class="nav__link" data-tab="masters">Masters</button>
      <button class="nav__link" data-tab="settings">Settings</button>
    </nav>
    <div class="sync-indicator" id="sync-indicator">
      <button class="sync-indicator__btn" id="sync-indicator-btn" type="button">
        <span class="sync-dot" id="sync-dot"></span>
        <span class="sync-indicator__label" id="sync-indicator-label">—</span>
      </button>
      <div class="sync-popover" id="sync-popover">
        <p class="sync-popover__status" id="sync-popover-status">—</p>
        <div class="sync-popover__actions">
          <button class="btn btn--small btn--primary" id="sync-push-btn">Push</button>
          <button class="btn btn--small btn--ghost" id="sync-pull-btn">Pull</button>
        </div>
        <button class="btn btn--tiny btn--ghost sync-popover__settings" id="sync-popover-settings">Sync settings</button>
      </div>
    </div>
  </div>
</header>

<nav class="bottom-nav" id="bottom-nav">
  <button class="bottom-nav__link" data-tab="dashboard">Dashboard</button>
  <button class="bottom-nav__link" data-tab="wardrobe">Wardrobe</button>
  <button class="bottom-nav__link" data-tab="outfit">Outfit</button>
  <button class="bottom-nav__link" data-tab="masters">Masters</button>
  <button class="bottom-nav__link" data-tab="settings">Settings</button>
</nav>

<main class="app-main" id="view"></main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<div class="toast-host" id="toast-host"></div>

<script src="js/data.js?v=20260915a"></script>
<script src="js/sync.js?v=20260915a"></script>
<script src="js/app.js?v=20260915a"></script>
</body>
</html>
